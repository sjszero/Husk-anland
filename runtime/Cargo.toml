[workspace]
resolver = "2"
members = [
    "crates/husk-input",
    "crates/husk-rd",
    "crates/husk-record",
    "crates/audio-relay",
    "crates/audio-setup",
    "crates/audio-probe",
    "crates/camera-client",
    "crates/capability-probe",
    "crates/guest-bench",
    "crates/drm-probe",
    "crates/drm-shim",
    "crates/drm-preload",
    "crates/gpu-probe",
    "crates/nr-tools",
    "crates/path-shim",
    "crates/logd",
    "crates/husk-init",
    "crates/ldconfig",
    "crates/usermgr",
    "crates/su",
    "crates/runtime-core",
    "crates/vulkan-probe",
    "crates/video-protocol",
    "crates/video-bridge",
    "crates/va-driver",
    "crates/va-node-shim",
    "crates/v4l2-shim",
    "crates/v4l2-preload",
    "crates/v4l2-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
panic = "abort"
opt-level = 3

[profile.dev]
panic = "abort"
