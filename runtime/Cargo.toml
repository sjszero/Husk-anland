[workspace]
resolver = "2"
members = [
    "crates/audio-relay",
    "crates/audio-setup",
    "crates/audio-probe",
    "crates/capability-probe",
    "crates/guest-bench",
    "crates/drm-probe",
    "crates/drm-shim",
    "crates/drm-preload",
    "crates/gpu-probe",
    "crates/nr-tools",
    "crates/path-shim",
    "crates/runtime-core",
    "crates/vulkan-probe",
    "crates/video-protocol",
    "crates/video-bridge",
    "crates/va-driver",
    "crates/va-node-shim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
panic = "abort"
opt-level = 3

[profile.dev]
panic = "abort"
