[package]
name = "runtime-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Guest-side Path Shim semantic and race probes"

[[bin]]
name = "runtime-probe"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
