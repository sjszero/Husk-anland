[package]
name = "path-shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
runtime-core = { path = "../runtime-core" }
drm-shim = { path = "../drm-shim" }
v4l2-shim = { path = "../v4l2-shim" }
