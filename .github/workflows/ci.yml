name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The runtime is aarch64 Linux. `cargo check` for that target works from any
  # host; only linking needs a cross linker, which the loader build takes from NDK.
  TARGET: aarch64-unknown-linux-gnu

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check --manifest-path runtime/Cargo.toml

  check:
    name: cargo check (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: rustup target add $TARGET
      # --workspace, not a hand-written -p list: the list used to name 8 of the
      # 39 crates, so a break in any other crate (audio, video, camera, session
      # guard, probe) stayed invisible. No --all-targets here on purpose: the
      # no_std crates (path-shim, drm-preload, v4l2-preload, v4l2-shim,
      # runtime-core, husk-init, logd) carry their own panic handler, so a test
      # harness target collides with it. Tests are a separate, explicit job.
      - run: cargo check --manifest-path runtime/Cargo.toml --target $TARGET --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: rustup target add $TARGET
      # Warnings are allowed (the shim keeps several on purpose); errors are not.
      - run: cargo clippy --manifest-path runtime/Cargo.toml --target $TARGET --workspace

  test:
    name: cargo test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      # Host target on purpose: these crates are std and their assertions are
      # pure, so they can run here. The no_std/aarch64 crates cannot - they are
      # compile-checked by the `check` job and exercised on a device instead.
      #
      # video-protocol and husk-va-driver are Linux-host-only: they call
      # libc::memfd_create, which the macOS libc crate does not expose, so
      # `cargo test` on the dev box cannot even link them. That is why they are
      # here and not in `make check`.
      - run: >
          cargo test --manifest-path runtime/Cargo.toml
          -p gpu-env -p session-env -p usermgr -p nr-tools
          -p location-probe -p audio-capture-probe -p husk-tools
          -p video-protocol -p husk-va-driver

  preloads:
    name: LD_PRELOAD layers (build + export contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      # v4l2-preload only links with exports.map on the line, and both layers
      # are dlopen targets that nothing links against - so a lost #[no_mangle]
      # is invisible to cargo check. `make preloads` builds both and asserts
      # the exported (and versioned) symbol set.
      - run: >
          make preloads
          NM=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm

  android:
    name: app-rs cross compile (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-rs
      - name: Resolve NDK
        id: ndk
        run: |
          set -eu
          # ubuntu-latest 没有 ANDROID_NDK_LATEST_HOME（那是 android runner 镜像才有的），
          # 以前这里直接拼 ${{ env.ANDROID_NDK_LATEST_HOME }}/toolchains/... 于是得到
          # "/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" 这种路径，作业必红。
          # 先找镜像里预装的，没有就自己装一个。
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          test -n "$sdk" || { echo "no ANDROID_HOME on this runner" >&2; exit 1; }
          ndk_dir=$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${ndk_dir:-}" ]; then
            sdkmanager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
            "$sdkmanager" --install "ndk;27.2.12479018" >/dev/null
            ndk_dir="$sdk/ndk/27.2.12479018"
          fi
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ndk=$ndk_dir" >> "$GITHUB_OUTPUT"
      - name: cargo build (lib + session guard)
        env:
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: >
          cargo build --release --manifest-path app-rs/Cargo.toml
          --target aarch64-linux-android --lib --bin husk-session-guard

  apk:
    name: APK build and version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 两个 target 都要：app-rs 编 aarch64-linux-android，而 `make loader`
      # 要编 guest 侧那几块 no_std crate（runtime-core / drm-shim / v4l2-shim），
      # 它们是 aarch64-unknown-linux-gnu。漏了这个 target，`make apk` 会在
      # `can't find crate for core` 上倒下（run 45824929709 实测）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-rs
      # `gradlew assembleDebug` alone is not enough: jniLibs/libhuskapp.so,
      # libhuskguard.so and libld.so are build outputs and none of them is
      # tracked, so a Gradle-only job would package an empty shell. `make apk`
      # is the target that builds the loader and the Rust app first.
      - name: Resolve NDK
        id: ndk
        run: |
          set -eu
          # ubuntu-latest 没有 ANDROID_NDK_LATEST_HOME（那是 android runner 镜像才有的），
          # 以前这里直接拼 ${{ env.ANDROID_NDK_LATEST_HOME }}/toolchains/... 于是得到
          # "/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" 这种路径，作业必红。
          # 先找镜像里预装的，没有就自己装一个。
          sdk=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          test -n "$sdk" || { echo "no ANDROID_HOME on this runner" >&2; exit 1; }
          ndk_dir=$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${ndk_dir:-}" ]; then
            sdkmanager=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
            "$sdkmanager" --install "ndk;27.2.12479018" >/dev/null
            ndk_dir="$sdk/ndk/27.2.12479018"
          fi
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ndk=$ndk_dir" >> "$GITHUB_OUTPUT"
      - name: make apk
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: make apk
      - name: APK carries all native pieces
        run: sh tools/ci/audit-apk-contents.sh apk
      - name: Xlorie asset is pinned and stripped
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: sh tools/ci/audit-xlorie-asset.sh
      - name: APK version matches VERSION
        run: sh tools/ci/audit-apk-version.sh
      - uses: actions/upload-artifact@v4
        with:
          name: husk-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk

  scripts:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -> tags are present, so the release-sequence half of the
      # offline audit really runs instead of printing SKIP.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release naming contract (offline half)
        run: sh tools/ci/audit-release-offline.sh

      - name: release version contract
        run: sh tools/ci/test-version-bump.sh

      - name: runtime package id contract
        run: sh tools/ci/audit-runtime-package.sh

      - name: sh -n every script
        run: |
          set -eu
          fail=0
          for f in $(git ls-files '*.sh'); do
            sh -n "$f" || { echo "syntax error: $f"; fail=1; }
          done
          exit $fail

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path runtime/Cargo.toml -p husk-tools
      - run: runtime/target/debug/husk-tools check-links

  brand:
    name: brand assets present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the README's logo and architecture figure exist
        run: |
          set -eu
          test -f docs/assets/brand/husk-mark-hexagon-h-512.png
          test -f docs/assets/brand/husk-mark-hexagon-h-1024.png
          test -f docs/assets/architecture.svg

  libc:
    name: libc patch artifact asserts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo build --manifest-path runtime/Cargo.toml -p nr-tools
      # The guest libc is a build artifact: it lives in the rootfs, not in this
      # repo (`tools/loader/libc-nop.so.6` is ignored on purpose). So CI does not
      # trust a file in the tree - it rebuilds the artifact from the pinned stock
      # package and asserts the result, which is stricter than the old
      # `--assert-only` pass over whatever happened to be on the dev box:
      #   * the transform is version-tied, so the input has to be glibc 2.39;
      #   * the slot page has to name every table entry except the ones declared
      #     refused in libc-interpose.expected (set equality, both directions);
      #   * clone3 has to disappear, rseq has to stay untouched;
      #   * every PT_LOAD has to be congruent modulo 4K/16K/64K;
      #   * and the bytes have to equal the artifact the release ships.
      # The two sha256 values below are the pin: change them only with a libc
      # bump, and only after `make libc-patch` on the device.
      #
      # 2026-11-27 (evidence 315): the runtime and the package database are now
      # both on 2.39-0ubuntu8.12. The old 8.5 pin was left behind after the
      # package metadata had already advanced, so a tree could claim 8.12 while
      # loading 8.5-patched bytes. These pins are the clean-install artifact.
      - name: rebuild the guest libc from the pinned stock package
        run: |
          set -eu
          DEB=libc6_2.39-0ubuntu8.12_arm64.deb
          WANT_DEB=2578bc27d4e077f5e93c283d2502bc693c516d9590a20a27840b548a4d436820
          WANT_OUT=16d5ba2120c1a92c0c9cba62dd8ec244d29d5d30a733d4ac530be4fb1b92933f
          # Launchpad keeps the exact input bytes; both the deb and transformed
          # output are pinned so a mirror or URL change fails closed.
          curl -fsSL --retry 3 -o "$DEB" \
            "https://launchpad.net/ubuntu/+archive/primary/+files/$DEB"
          echo "$WANT_DEB  $DEB" | sha256sum -c -
          dpkg-deb -x "$DEB" stock
          LIBC=$(find stock -path '*aarch64-linux-gnu/libc.so.6' | head -1)
          test -n "$LIBC"
          runtime/target/debug/nr-tools libc-patch "$LIBC" "$RUNNER_TEMP/libc.so.6" \
            --table tools/loader/libc-interpose.txt
          echo "$WANT_OUT  $RUNNER_TEMP/libc.so.6" | sha256sum -c -
