[package]
name = "husk-app"
version = "0.2.0"
edition = "2021"

[lib]
name = "huskapp"
crate-type = ["cdylib"]

[[bin]]
name = "husk-session-guard"
path = "src/bin/husk-session-guard.rs"

[dependencies]
gpu-env = { path = "../runtime/crates/gpu-env" }
session-env = { path = "../runtime/crates/session-env" }
video-protocol = { path = "../runtime/crates/video-protocol" }
fontdue = { version = "0.9", default-features = false, features = ["std"] }
jni = "0.21.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
