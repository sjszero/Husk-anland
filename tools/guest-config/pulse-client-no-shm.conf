# /etc/pulse/client.conf.d/99-husk-no-shm.conf
#
# 为什么需要：Husk 里的 PulseAudio 客户端和服务器**连不上**，报的是
#
#   Received memfd ID registration request over a pipe that does not support memfds
#   Received SHM frame on a socket where SHM is disabled.
#   Connection failure: Connection terminated
#
# 也就是说共享内存协商（memfd + SCM_RIGHTS 传 fd）在这条链上走不通，客户端
# 一握手就被服务器断掉；把 SHM 关掉走纯 socket 就正常（实测 pactl info / paplay /
# pacat 全部通过，见 evidence 193）。代价是音频数据多一次拷贝 —— 对 44.1 kHz 立体声
# 可以忽略，比"根本没声音"好得多。
#
# 真正的修法应该在 path-shim 的 fd 传递上，这一步是止血，不是根治。
enable-shm = no
