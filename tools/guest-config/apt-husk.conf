// A husk runs everything as one uid. There is no second user to drop to, and
// asking the kernel to switch to _apt for downloads only produces
//   E: Method gave invalid 400 URI Failure message: Could not switch group
//   E: Method http has died unexpectedly!
// The container convention (and what apt itself expects when it is told the
// sandbox user is already the caller) is to keep the identity alone.
APT::Sandbox::User "root";
