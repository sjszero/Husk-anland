<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Husk guest system bus.

  Why this file has to exist in the tree: gnome-shell aborts during init when
  accountsservice cannot be reached on the system bus ("Couldn't connect to
  system bus ... Execution of main.js threw exception", evidence 191). The
  stock Ubuntu /usr/share/dbus-1/system.conf brings up the bus with systemd
  activation and polkit checks that this guest does not have, so the session
  scripts start dbus-daemon against this file instead.

  Design, deliberately narrow:
    * one bus, one socket, at the path the session scripts already expect
      (/run/dbus/system_bus_socket inside the guest rootfs);
    * EXTERNAL auth only, no anonymous, no TCP listener;
    * the guest today is a single-user root userspace (see the architecture
      note: the path shim is not a security boundary), so the policy is
      permissive for local users instead of pretending to be a hardened system
      bus. Do not deploy this file as the host's system bus config.

  Generated by tools/guest/install-husk.sh; source of truth is
  tools/guest-config/linuxhub-system-bus.conf.
-->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
  <include ignore_missing="yes">system-local.conf</include>
</busconfig>
